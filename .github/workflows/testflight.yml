name: TestFlight

# Builds a Release archive on a macOS runner, signs it with Apple's cloud-managed distribution
# certificate and uploads it to TestFlight. No certificate or provisioning profile is stored.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID              10-character team ID from developer.apple.com
#   BUNDLE_ID                  e.g. com.yourname.photomesh (must exist in App Store Connect)
#   ASC_KEY_ID                 App Store Connect API key ID (the key needs the Admin role so it can
#                              use cloud-managed signing)
#   ASC_ISSUER_ID              App Store Connect API issuer ID
#   ASC_PRIVATE_KEY_BASE64     base64 of the AuthKey_XXXX.p8 file
# Optional:
#   OPENROUTER_TESTER_KEY      OpenRouter key baked into the build for testers (give it a credit
#                              limit on openrouter.ai). Without it testers get the sample circuit.
#
# Build numbers are 100 + the workflow run number, so they stay above the builds 1–5 that were
# uploaded from a Mac before this workflow existed.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCHEME: PhotoMesh
      PROJECT: PhotoMesh.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/PhotoMesh.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make sure no key is committed
        run: tools/embed-key.sh --check

      - name: Embed the tester key
        env:
          OPENROUTER_TESTER_KEY: ${{ secrets.OPENROUTER_TESTER_KEY }}
        run: |
          if [ -n "$OPENROUTER_TESTER_KEY" ]; then
            tools/embed-key.sh "$OPENROUTER_TESTER_KEY"
          else
            echo "OPENROUTER_TESTER_KEY is not set; this build will have no built-in key."
          fi

      - name: Select Xcode
        run: |
          # App Store Connect only accepts builds made with a current SDK, so use the newest Xcode on the image.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Archive (unsigned; signed during export)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$((100 + GITHUB_RUN_NUMBER))" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          test -d "$ARCHIVE_PATH"

      - name: Sign, export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/private_keys
          tools/embed-key.sh --clear || true
